<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雙重共享日程系統</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            --main-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-color: #667eea;
            background: var(--main-gradient);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.5s ease;
        }
        /* 日曆 B 主題色 (藍綠色) */
        body.calendar-2-mode {
            --main-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --accent-color: #11998e;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            background: var(--main-gradient);
            border-radius: 15px 15px 0 0;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            transition: background 0.5s ease;
        }
        .logo { display: flex; align-items: center; gap: 10px; color: white; font-size: 1.4em; font-weight: bold; }
        .nav-buttons { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .nav-btn {
            background: rgba(255,255,255,0.2); color: white; border: none;
            padding: 10px 20px; border-radius: 25px; cursor: pointer;
            font-size: 0.95em; transition: all 0.3s;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); }
        .switch-calendar-btn { background: rgba(255,255,255,0.9); color: #333; font-weight: bold; }
        .switch-calendar-btn:hover { background: white; transform: scale(1.05); }
        .today-btn { background: #27ae60; }
        .owner-filter-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .owner-filter-btn {
            background: rgba(255,255,255,0.15); color: white; border: 2px solid rgba(255,255,255,0.3);
            padding: 6px 14px; border-radius: 20px; cursor: pointer;
            font-size: 0.85em; transition: all 0.25s; font-weight: 500;
        }
        .owner-filter-btn:hover { background: rgba(255,255,255,0.25); transform: translateY(-1px); }
        .owner-filter-btn.active { background: rgba(255,255,255,0.95); color: #333; border-color: white; font-weight: bold; }
        .owner-filter-btn.active.gaspar { background: #667eea; color: white; border-color: #667eea; }
        .owner-filter-btn.active.yoyopan { background: #e74c3c; color: white; border-color: #e74c3c; }
        .owner-filter-btn.active.annie { background: #f39c12; color: white; border-color: #f39c12; }
        .owner-filter-btn.active.candy { background: #27ae60; color: white; border-color: #27ae60; }
        .current-month { font-size: 1.3em; font-weight: bold; color: white; min-width: 130px; text-align: center; }
        .calendar { background: white; border-radius: 0 0 20px 20px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 5px; }
        .weekday { text-align: center; padding: 15px 10px; font-weight: bold; color: #666; font-size: 0.9em; }
        .weekday:first-child { color: #e74c3c; } .weekday:last-child { color: #3498db; }
        .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; align-items: start; }
        .day {
            height: 90px; padding: 10px; border-radius: 10px; background: #f8f9fa;
            cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden;
        }
        .day:hover { background: #e8f4fd; transform: scale(1.02); }
        .day.other-month { opacity: 0.4; }
        .day.today { background: var(--main-gradient); color: white; }
        .day.today .day-number { color: white !important; }
        .day-number { font-weight: bold; font-size: 1em; margin-bottom: 5px; color: #333; }
        .day:nth-child(7n+1) .day-number { color: #e74c3c; }
        .day:nth-child(7n) .day-number { color: #3498db; }
        .day.today .day-number { color: white !important; }
        .events-container { max-height: 50px; overflow-y: auto; }
        .event {
            background: var(--main-gradient); color: white; padding: 2px 6px;
            border-radius: 4px; font-size: 0.7em; margin-bottom: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .day.today .event { background: rgba(255,255,255,0.3); }
        .event.owner-yoyopan { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .event.owner-gaspar { background: linear-gradient(135deg, #667eea, #764ba2); }
        .event.owner-annie { background: linear-gradient(135deg, #f39c12, #d68910); }
        .event.owner-candy { background: linear-gradient(135deg, #27ae60, #1e8449); }
        .event-count {
            position: absolute; top: 5px; right: 5px; background: #e74c3c; color: white;
            width: 18px; height: 18px; border-radius: 50%; font-size: 0.65em;
            display: flex; align-items: center; justify-content: center;
        }
        /* 提醒區域樣式 */
        .alerts-container {
            margin-top: 20px; background: rgba(255, 255, 255, 0.95);
            border-radius: 15px; padding: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px); animation: slideUp 0.4s ease-out;
        }
