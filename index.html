<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雙重共享日程系統</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            --main-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-color: #667eea;
            background: var(--main-gradient);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.5s ease;
        }
        /* 日曆 B 主題色 (藍綠色) */
        body.calendar-2-mode {
            --main-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --accent-color: #11998e;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            background: var(--main-gradient);
            border-radius: 15px 15px 0 0;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            transition: background 0.5s ease;
        }
        .logo { display: flex; align-items: center; gap: 10px; color: white; font-size: 1.4em; font-weight: bold; }
        .nav-buttons { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .nav-btn {
            background: rgba(255,255,255,0.2); color: white; border: none;
            padding: 10px 20px; border-radius: 25px; cursor: pointer;
            font-size: 0.95em; transition: all 0.3s;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); }
        .switch-calendar-btn { background: rgba(255,255,255,0.9); color: #333; font-weight: bold; }
        .switch-calendar-btn:hover { background: white; transform: scale(1.05); }
        .today-btn { background: #27ae60; }
        .owner-filter-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .owner-filter-btn {
            background: rgba(255,255,255,0.15); color: white; border: 2px solid rgba(255,255,255,0.3);
            padding: 6px 14px; border-radius: 20px; cursor: pointer;
            font-size: 0.85em; transition: all 0.25s; font-weight: 500;
        }
        .owner-filter-btn:hover { background: rgba(255,255,255,0.25); transform: translateY(-1px); }
        .owner-filter-btn.active { background: rgba(255,255,255,0.95); color: #333; border-color: white; font-weight: bold; }
        .owner-filter-btn.active.gaspar { background: #667eea; color: white; border-color: #667eea; }
        .owner-filter-btn.active.yoyopan { background: #e74c3c; color: white; border-color: #e74c3c; }
        .owner-filter-btn.active.annie { background: #f39c12; color: white; border-color: #f39c12; }
        .owner-filter-btn.active.candy { background: #27ae60; color: white; border-color: #27ae60; }
        .current-month { font-size: 1.3em; font-weight: bold; color: white; min-width: 130px; text-align: center; }
        .calendar { background: white; border-radius: 0 0 20px 20px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 5px; }
        .weekday { text-align: center; padding: 15px 10px; font-weight: bold; color: #666; font-size: 0.9em; }
        .weekday:first-child { color: #e74c3c; } .weekday:last-child { color: #3498db; }
        .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; align-items: start; }
        .day {
            height: 90px; padding: 10px; border-radius: 10px; background: #f8f9fa;
            cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden;
        }
        .day:hover { background: #e8f4fd; transform: scale(1.02); }
        .day.other-month { opacity: 0.4; }
        .day.today { background: var(--main-gradient); color: white; }
        .day.today .day-number { color: white !important; }
        .day-number { font-weight: bold; font-size: 1em; margin-bottom: 5px; color: #333; }
        .day:nth-child(7n+1) .day-number { color: #e74c3c; }
        .day:nth-child(7n) .day-number { color: #3498db; }
        .day.today .day-number { color: white !important; }
        .events-container { max-height: 50px; overflow-y: auto; }
        .event {
            background: var(--main-gradient); color: white; padding: 2px 6px;
            border-radius: 4px; font-size: 0.7em; margin-bottom: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .day.today .event { background: rgba(255,255,255,0.3); }
        .event.owner-yoyopan { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .event.owner-gaspar { background: linear-gradient(135deg, #667eea, #764ba2); }
        .event.owner-annie { background: linear-gradient(135deg, #f39c12, #d68910); }
        .event.owner-candy { background: linear-gradient(135deg, #27ae60, #1e8449); }
        .event-count {
            position: absolute; top: 5px; right: 5px; background: #e74c3c; color: white;
            width: 18px; height: 18px; border-radius: 50%; font-size: 0.65em;
            display: flex; align-items: center; justify-content: center;
        }
        /* 提醒區域樣式 */
        .alerts-container {
            margin-top: 20px; background: rgba(255, 255, 255, 0.95);
            border-radius: 15px; padding: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px); animation: slideUp 0.4s ease-out;
        }
        .alerts-header {
            display: flex; align-items: center; gap: 10px; margin-bottom: 15px;
            color: #333; font-size: 1.1em; font-weight: bold;
            border-bottom: 2px solid #eee; padding-bottom: 10px;
        }
        .alert-list { display: flex; flex-direction: column; gap: 8px; }
        .alert-item {
            background: #f8f9fa; padding: 10px 12px; border-radius: 10px;
            border-left: 4px solid var(--accent-color);
        }
        .alert-date-group {
            font-size: 0.84em; color: #555; margin-bottom: 6px; font-weight: bold;
        }
        .alert-title {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            font-weight: bold; color: #333; margin-bottom: 4px;
            min-width: 0;
        }
        .alert-title-text {
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        .alert-time { font-size: 0.8em; color: var(--accent-color); font-weight: bold; flex-shrink: 0; }
        .alert-meta {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.82em; color: #666; flex-wrap: wrap;
        }
        .alert-date-group {
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        .no-upcoming { text-align: center; color: #999; padding: 15px; font-style: italic; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white; border-radius: 20px; padding: 25px; width: 90%;
            max-width: 450px; max-height: 80vh; overflow-y: auto; animation: slideIn 0.3s;
        }
        @keyframes slideIn { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #eee; }
        .modal-header h2 { color: #333; font-size: 1.3em; }
        .close-btn { background: none; border: none; font-size: 1.8em; cursor: pointer; color: #999; }
        .close-btn:hover { color: #e74c3c; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: bold; color: #333; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1em;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--accent-color); }
        .form-group textarea { resize: vertical; min-height: 70px; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 12px 20px; border: none; border-radius: 10px; font-size: 1em; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: var(--main-gradient); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .event-list { margin-top: 15px; }
        .event-item {
            background: #f8f9fa; border-radius: 10px; padding: 12px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .event-item:hover { background: #e8f4fd; }
        .event-info { flex: 1; }
        .event-info h4 { color: #333; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .event-info p { color: #666; font-size: 0.85em; }
        .event-time { color: var(--accent-color); font-weight: bold; }
        .event-actions { display: flex; gap: 6px; }
        .event-actions button { padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.8em; }
        .edit-btn { background: #3498db; color: white; }
        .delete-btn { background: #e74c3c; color: white; }
        .owner-badge { padding: 2px 8px; border-radius: 10px; font-size: 0.7em; }
        .owner-badge.yoyopan { background: #ffebee; color: #e74c3c; }
        .owner-badge.gaspar { background: #e8f4fd; color: #667eea; }
        .owner-badge.annie { background: #fff8e1; color: #f39c12; }
        .owner-badge.candy { background: #e8f5e9; color: #27ae60; }
        .no-events { text-align: center; color: #999; padding: 25px; }
        .connection-status {
            position: fixed; bottom: 15px; right: 15px; padding: 8px 15px;
            border-radius: 20px; font-size: 0.8em; color: white;
            display: flex; align-items: center; gap: 6px; z-index: 100;
        }
        .connection-status.online { background: #27ae60; }
        .connection-status.offline { background: #95a5a6; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: white; }
        
        @media (max-width: 768px) {
            body { padding: 10px; }
            .header { flex-direction: column; gap: 10px; padding: 15px; }
            .owner-filter-group { justify-content: center; }
            .day { height: 65px; padding: 5px; }
            .day-number { font-size: 0.85em; }
            .event { font-size: 0.6em; }
            .weekday { padding: 10px 5px; font-size: 0.8em; }
            .nav-buttons { flex-wrap: wrap; justify-content: center; }
            .event-item { flex-direction: column; align-items: flex-start; gap: 10px; }
            .event-actions { width: 100%; }
            .event-actions button { flex: 1; }
            .alert-title { align-items: flex-start; flex-direction: column; gap: 4px; }
        }
        .toast {
            position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
            padding: 12px 25px; border-radius: 10px; color: white; z-index: 2000;
            animation: toastIn 0.3s;
        }
        .toast.success { background: #27ae60; }
        .toast.error { background: #e74c3c; }
        .toast.info { background: #3498db; }
        @keyframes toastIn { from { transform: translate(-50%, 50px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <span id="logoIcon">📐</span>
                <span id="logoText">數學測考</span>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn switch-calendar-btn" onclick="toggleCalendarMode()">🔄 切換其他測考及假期</button>
                <button class="nav-btn" onclick="previousMonth()">◀ 上月</button>
                <span class="current-month" id="currentMonth"></span>
                <button class="nav-btn" onclick="nextMonth()">下月 ▶</button>
                <button class="nav-btn today-btn" onclick="goToToday()">今天</button>
                <button class="nav-btn" style="background:#e67e22;" onclick="openStudentList()">📋 學生報名</button>
            </div>
            <div class="owner-filter-group">
                <button class="owner-filter-btn" id="filter-gaspar" onclick="toggleOwnerFilter('gaspar')">Gaspar</button>
                <button class="owner-filter-btn" id="filter-yoyopan" onclick="toggleOwnerFilter('yoyopan')">Yoyopan</button>
                <button class="owner-filter-btn" id="filter-annie" onclick="toggleOwnerFilter('annie')">Annie</button>
                <button class="owner-filter-btn" id="filter-candy" onclick="toggleOwnerFilter('candy')">Candy</button>
            </div>
        </div>

        <div class="calendar">
            <div class="weekdays">
                <div class="weekday">週日</div><div class="weekday">週一</div><div class="weekday">週二</div>
                <div class="weekday">週三</div><div class="weekday">週四</div><div class="weekday">週五</div><div class="weekday">週六</div>
            </div>
            <div class="days" id="calendarDays"></div>
        </div>

        <!-- 提醒區域 (僅在日曆 A 顯示) -->
        <div id="upcomingAlerts" class="alerts-container" style="display: none;">
            <div class="alerts-header">
                <span class="alerts-icon">🔔</span>
                <span>未來兩週預覽 (來自其他測考及假期)</span>
            </div>
            <div class="alert-list" id="alertList"><div class="no-upcoming">載入中...</div></div>
        </div>
    </div>

    <div class="connection-status offline" id="connectionStatus">
        <span class="status-dot"></span><span id="statusText">連接中...</span>
    </div>

    <div class="modal" id="dayModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalDate"></h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <button class="btn btn-primary" style="width:100%; margin-bottom:15px;" onclick="showAddForm()">➕ 添加日程</button>
            <div class="event-list" id="eventList"></div>
        </div>
    </div>

    <div class="modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="eventModalTitle">添加日程</h2>
                <button class="close-btn" onclick="closeEventModal()">&times;</button>
            </div>
            <form id="eventForm" onsubmit="saveEvent(event)">
                <div class="form-group">
                    <label>📝 標題</label>
                    <input type="text" id="eventTitle" placeholder="例如：微積分測驗" required>
                </div>
                <div class="form-group">
                    <label>⏰ 時間</label>
                    <input type="time" id="eventTime">
                </div>
                <div class="form-group">
                    <label>👤 負責人</label>
                    <select id="eventOwner">
                        <option value="yoyopan">yoyopan</option>
                        <option value="gaspar">gaspar</option>
                        <option value="annie">annie</option>
                        <option value="candy">candy</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>📋 備註</label>
                    <textarea id="eventDescription" placeholder="考試範圍、地點等說明"></textarea>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" onclick="closeEventModal()">取消</button>
                    <button type="submit" class="btn btn-primary">💾 保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 學生報名列表 Modal -->
    <div class="modal" id="studentListModal">
        <div class="modal-content" style="max-width: 900px;">
            <div class="modal-header">
                <h2>📋 學生報名表</h2>
                <button class="close-btn" onclick="closeStudentListModal()">&times;</button>
            </div>
            <div style="display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap;">
                <button class="btn btn-primary" onclick="showStudentForm()">➕ 新增報名</button>
                <button class="btn" style="background:#27ae60; color:white;" onclick="exportToExcel()">📥 匯出 Excel</button>
                <button class="btn" style="background:#8e44ad; color:white;" onclick="document.getElementById('importFileInput').click()">📤 匯入 Excel</button>
                <button class="btn" style="background:#c0392b; color:white;" onclick="clearAllStudents()">🗑️ 一鍵清空</button>
                <input type="file" id="importFileInput" accept=".xlsx,.xls" style="display:none;" onchange="handleImportFile(this)">
                <span id="studentCount" style="display:flex; align-items:center; color:#666; font-size:0.9em;"></span>
            </div>
            <div style="overflow-x:auto;">
                <table id="studentTable" style="width:100%; border-collapse:collapse; font-size:0.85em;">
                    <thead>
                        <tr style="background:#f0f0f0;">
                            <th style="padding:8px; text-align:left; border-bottom:2px solid #ddd;">中文姓名</th>
                            <th style="padding:8px; text-align:left; border-bottom:2px solid #ddd;">English Name</th>
                            <th style="padding:8px; text-align:left; border-bottom:2px solid #ddd;">Class</th>
                            <th style="padding:8px; text-align:left; border-bottom:2px solid #ddd;">Mobile</th>
                            <th style="padding:8px; text-align:left; border-bottom:2px solid #ddd;">可補習日子</th>
                            <th style="padding:8px; text-align:left; border-bottom:2px solid #ddd;">留班</th>
                            <th style="padding:8px; text-align:center; border-bottom:2px solid #ddd;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody"></tbody>
                </table>
            </div>
            <div id="noStudentData" class="no-events">📭 暫無學生報名資料</div>
        </div>
    </div>

    <!-- 學生報名表單 Modal -->
    <div class="modal" id="studentFormModal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2 id="studentFormTitle">新增報名</h2>
                <button class="close-btn" onclick="closeStudentFormModal()">&times;</button>
            </div>
            <form id="studentForm" onsubmit="saveStudent(event)">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div class="form-group">
                        <label>中文姓名 *</label>
                        <input type="text" id="studentChineseName" placeholder="中文姓名" required>
                    </div>
                    <div class="form-group">
                        <label>中文姓名譯音</label>
                        <input type="text" id="studentTransliteration" placeholder="粵語拼音/國語拼音">
                    </div>
                    <div class="form-group">
                        <label>English Name</label>
                        <input type="text" id="studentEnglishName" placeholder="English Name">
                    </div>
                    <div class="form-group">
                        <label>Class（年級）</label>
                        <input type="text" id="studentClass" placeholder="例如：F1A">
                    </div>
                </div>
                <div class="form-group">
                    <label>Mobile No *</label>
                    <input type="tel" id="studentMobile" placeholder="請輸入電話號碼" required>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div class="form-group">
                        <label>姓名（父親）</label>
                        <input type="text" id="studentFatherName" placeholder="父親姓名">
                    </div>
                    <div class="form-group">
                        <label>電話（父親）</label>
                        <input type="tel" id="studentFatherPhone" placeholder="父親電話">
                    </div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div class="form-group">
                        <label>姓名（母親）</label>
                        <input type="text" id="studentMotherName" placeholder="母親姓名">
                    </div>
                    <div class="form-group">
                        <label>電話（母親）</label>
                        <input type="tel" id="studentMotherPhone" placeholder="母親電話">
                    </div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div class="form-group">
                        <label>其他聯絡人</label>
                        <input type="text" id="studentOtherContact" placeholder="其他聯絡人姓名">
                    </div>
                    <div class="form-group">
                        <label>電話（其他聯絡人）</label>
                        <input type="tel" id="studentOtherContactPhone" placeholder="其他聯絡人電話">
                    </div>
                </div>
                <div class="form-group">
                    <label>Birth</label>
                    <input type="date" id="studentBirth">
                </div>
                <div class="form-group">
                    <label>可補習日子</label>
                    <div style="display:flex; gap:8px; flex-wrap:wrap;" id="daysCheckboxGroup">
                        <label style="display:flex; align-items:center; gap:4px; cursor:pointer;">
                            <input type="checkbox" value="Mon"> Mon
                        </label>
                        <label style="display:flex; align-items:center; gap:4px; cursor:pointer;">
                            <input type="checkbox" value="Tue"> Tue
                        </label>
                        <label style="display:flex; align-items:center; gap:4px; cursor:pointer;">
                            <input type="checkbox" value="Wed"> Wed
                        </label>
                        <label style="display:flex; align-items:center; gap:4px; cursor:pointer;">
                            <input type="checkbox" value="Thu"> Thu
                        </label>
                        <label style="display:flex; align-items:center; gap:4px; cursor:pointer;">
                            <input type="checkbox" value="Fri"> Fri
                        </label>
                        <label style="display:flex; align-items:center; gap:4px; cursor:pointer;">
                            <input type="checkbox" value="Sat"> Sat
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label>校外活動</label>
                    <div id="extracurricularContainer">
                    </div>
                    <button type="button" onclick="addExtraRow()" style="background:#3498db; color:white; border:none; border-radius:8px; padding:8px 16px; cursor:pointer; font-size:0.9em; margin-top:4px;">➕ 新增活動</button>
                </div>
                <div class="form-group">
                    <label>留班記錄</label>
                    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
                        <label style="display:flex; align-items:center; gap:4px; cursor:pointer;">
                            <input type="radio" name="retained" value="no" checked onchange="toggleRetainedGrade(false)"> 無留班
                        </label>
                        <label style="display:flex; align-items:center; gap:4px; cursor:pointer;">

        function initCalendarMode(modeId) {

        function loadLocalData() {

                events = {}; 
            }
        }

        function saveLocalData() {
            localStorage.setItem(localStorageKey, JSON.stringify(events));

        function setupFirebaseListener() {
            if (!eventsRef) return;
            
            database.ref('.info/connected').on('value', (snap) => {
                isConnected = snap.val() === true;
                updateStatus(isConnected);
            });

            eventsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (JSON.stringify(events) !== JSON.stringify(data)) {
                    events = data || {};
                    saveLocalData();
                    renderCalendar();
                    updateOpenModal();
                }
                updateStatus(true);
            }, (error) => {
                console.error("[Firebase] 讀取錯誤:", error);

        function fetchCalendarBData() {
            const calB_Ref = database.ref('events_other');
            calB_Ref.on('value', (snapshot) => {
                calendarB_Events = snapshot.val() || {};
                if (currentCalendarId === 'calendarA') renderUpcomingAlerts();
            });
        }

        /**
         * 【優化核心】按標題分組，並依「最早開始日期」排序
         */
        function renderUpcomingAlerts() {
            const listEl = document.getElementById('alertList');
            if (!listEl) return;
            
            const today = new Date(); 
            today.setHours(0,0,0,0);
            const endDate = new Date(today); 
            endDate.setDate(endDate.getDate() + 14);

            const groupedMap = new Map();

            for (const dateKey in calendarB_Events) {
                const parts = dateKey.split('-');
                if (parts.length !== 3) continue;
                const eventDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                eventDate.setHours(0, 0, 0, 0);

                if (eventDate < today || eventDate > endDate) continue;

                Object.values(calendarB_Events[dateKey]).forEach(ev => {
                    const title = ev.title || '未命名日程';

                    if (!groupedMap.has(title)) {
                        groupedMap.set(title, {
                            title,
                            dateMap: new Map(),
                            firstTimestamp: eventDate.getTime()
                        });
                    }

                    const group = groupedMap.get(title);
                    const dayKey = `${eventDate.getFullYear()}-${String(eventDate.getMonth() + 1).padStart(2, '0')}-${String(eventDate.getDate()).padStart(2, '0')}`;

                    if (!group.dateMap.has(dayKey)) {
                        group.dateMap.set(dayKey, {
                            date: new Date(eventDate)
                        });
                    }

                    if (eventDate.getTime() < group.firstTimestamp) {
                        group.firstTimestamp = eventDate.getTime();
                    }
                });
            }

            const groupedEvents = Array.from(groupedMap.values()).sort((a, b) => a.firstTimestamp - b.firstTimestamp);

            if (groupedEvents.length === 0) {
                listEl.innerHTML = '<div class="no-upcoming">✅ 未來兩週沒有來自「其他測考及假期」的日程</div>';
                return;
            }

            const weekDays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];

            const singleDayByDate = new Map();
            const multiDayGroups = [];

            groupedEvents.forEach(group => {
                const dateEntries = Array.from(group.dateMap.values()).sort((a, b) => a.date.getTime() - b.date.getTime());
                if (dateEntries.length === 1) {
                    const d = dateEntries[0].date;
                    const dateKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                    if (!singleDayByDate.has(dateKey)) {
                        singleDayByDate.set(dateKey, { date: d, titles: [] });
                    }
                    singleDayByDate.get(dateKey).titles.push(group.title);
                } else {
                    multiDayGroups.push({ title: group.title, dates: dateEntries.map(entry => entry.date), firstTimestamp: group.firstTimestamp });
                }
            });

            const rows = [];

            Array.from(singleDayByDate.values())
                .sort((a, b) => a.date.getTime() - b.date.getTime())
                .forEach(item => {
                    const dateLabel = `${item.date.getMonth() + 1}/${item.date.getDate()}(${weekDays[item.date.getDay()]})`;
                    rows.push({
                        ts: item.date.getTime(),
                        html: `
                        <div class="alert-item">
                            <div class="alert-title">
                                <span class="alert-title-text">${dateLabel}</span>
                            </div>
                            <div class="alert-date-group">${item.titles.join('、')}</div>
                        </div>`
                    });
                });

            multiDayGroups
                .sort((a, b) => a.firstTimestamp - b.firstTimestamp)
                .forEach(group => {
                    const dateText = group.dates
                        .map(d => `${d.getMonth() + 1}/${d.getDate()}(${weekDays[d.getDay()]})`)
                        .join('、');
                    rows.push({
                        ts: group.firstTimestamp,
                        html: `
                        <div class="alert-item">
                            <div class="alert-title">
                                <span class="alert-title-text">${dateText}</span>
                            </div>
                            <div class="alert-date-group">${group.title}</div>
                        </div>`
                    });
                });

            rows.sort((a, b) => a.ts - b.ts);
            listEl.innerHTML = rows.map(row => row.html).join('');
        }

        function syncToCloud() {
            if (eventsRef && isConnected) {
                eventsRef.set(events).catch((err) => {
                    console.error("同步失敗", err);
                    showToast('同步失敗，已存於本地', 'error');
                });
            }
        }

        function updateStatus(online) {
            const el = document.getElementById('connectionStatus');
            const text = document.getElementById('statusText');
            if (el && text) {
                el.className = 'connection-status ' + (online ? 'online' : 'offline');
                const shortName = calendarConfigs[currentCalendarId].name.length > 4 
                    ? calendarConfigs[currentCalendarId].name.substring(0, 4) + '..' 
                    : calendarConfigs[currentCalendarId].name;
                text.textContent = online ? `${shortName} 已同步` : '離線模式';
            }
        }

        function renderCalendar() {
            const year = currentDate.getFullYear(), month = currentDate.getMonth();
            const monthEl = document.getElementById('currentMonth');
            if (monthEl) monthEl.textContent = `${year}年 ${month + 1}月`;
            const firstDay = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();
            const container = document.getElementById('calendarDays');
            if (!container) return;
            container.innerHTML = '';
            const today = new Date();
            for (let i = firstDay - 1; i >= 0; i--) container.appendChild(createDay(prevLastDay - i, year, month - 1, true));
            for (let d = 1; d <= totalDays; d++) {
                const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === d;
                container.appendChild(createDay(d, year, month, false, isToday));
            }
            const remaining = 42 - container.children.length;
            for (let d = 1; d <= remaining; d++) container.appendChild(createDay(d, year, month + 1, true));
        }

        function createDay(day, year, month, isOther, isToday = false) {
            const el = document.createElement('div');
            el.className = 'day' + (isOther ? ' other-month' : '') + (isToday ? ' today' : '');
            let y = year, m = month;
            if (month < 0) { m = 11; y--; } else if (month > 11) { m = 0; y++; }
            const key = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            let dayEvents = events[key] ? Object.values(events[key]) : [];
            dayEvents.sort((a, b) => (a.time || '').localeCompare(b.time || ''));
            const totalCount = dayEvents.length;
            if (ownerFilter) {
                dayEvents = dayEvents.filter(e => e.owner === ownerFilter);
            }
            const filteredCount = dayEvents.length;
            const showCount = ownerFilter ? (filteredCount > 0 ? filteredCount : '') : (filteredCount > 0 ? totalCount : '');
            el.innerHTML = `
                <div class="day-number">${day}</div>
                <div class="events-container">${dayEvents.map(e => `<div class="event owner-${e.owner}">${e.title}</div>`).join('')}</div>
                ${showCount !== '' ? `<div class="event-count">${showCount}</div>` : ''}
            `;
            el.onclick = () => openDayModal(y, m, day);
            return el;
        }

        function previousMonth() { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); }
        function nextMonth() { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); }
        function goToToday() { currentDate = new Date(); renderCalendar(); }

        function openDayModal(year, month, day) {
            selectedDate = { year, month, day };
            document.getElementById('modalDate').textContent = `${year}年${month+1}月${day}日`;
            renderEventList();
            document.getElementById('dayModal').classList.add('active');

        function closeModal() { document.getElementById('dayModal').classList.remove('active'); }
        function showAddForm() {
            editingEventId = null;
            document.getElementById('eventModalTitle').textContent = '添加日程';

                document.getElementById('eventOwner').value = ownerFilter;

        function updateOpenModal() {
            if (selectedDate && document.getElementById('dayModal').classList.contains('active')) renderEventList();

        function renderEventList() {
            if (!selectedDate) return;
            const key = `${selectedDate.year}-${String(selectedDate.month+1).padStart(2,'0')}-${String(selectedDate.day).padStart(2,'0')}`;
            const list = document.getElementById('eventList');
            const dayEvents = events[key] ? Object.values(events[key]) : [];
            
            if (dayEvents.length === 0) { 
                list.innerHTML = '<div class="no-events">📭 沒有日程</div>'; 
                return; 
            }
            dayEvents.sort((a, b) => (a.time || '').localeCompare(b.time || ''));
            list.innerHTML = dayEvents.map(e => `
                <div class="event-item">
                    <div class="event-info">
                        <h4>${e.time ? `<span class="event-time">${e.time}</span>` : ''} ${e.title}
                        <span class="owner-badge ${e.owner}">${e.owner}</span></h4>
                        ${e.description ? `<p>${e.description}</p>` : ''}
                    </div>
                    <div class="event-actions">
                        <button class="edit-btn" onclick="editEvent('${e.id}')">編輯</button>
                        <button class="delete-btn" onclick="deleteEvent('${e.id}')">刪除</button>
                    </div>
                </div>
            `).join('');
        }

        function saveEvent(e) {
            e.preventDefault();
            const key = `${selectedDate.year}-${String(selectedDate.month+1).padStart(2,'0')}-${String(selectedDate.day).padStart(2,'0')}`;
            const id = editingEventId || Date.now().toString();
            if (!events[key]) events[key] = {};
            events[key][id] = {
                id, title: document.getElementById('eventTitle').value,
                time: document.getElementById('eventTime').value,
                owner: document.getElementById('eventOwner').value,
                description: document.getElementById('eventDescription').value
            };
            saveLocalData(); syncToCloud(); renderCalendar(); renderEventList(); closeEventModal();
            showToast('已保存', 'success');
        }

        function editEvent(id) {
            const key = `${selectedDate.year}-${String(selectedDate.month+1).padStart(2,'0')}-${String(selectedDate.day).padStart(2,'0')}`;
            const ev = events[key]?.[id];
            if (!ev) return;
            editingEventId = id;
            document.getElementById('eventModalTitle').textContent = '編輯日程';
            document.getElementById('eventTitle').value = ev.title || '';
            document.getElementById('eventTime').value = ev.time || '';
            document.getElementById('eventOwner').value = ev.owner || 'yoyopan';
            document.getElementById('eventDescription').value = ev.description || '';
            document.getElementById('eventModal').classList.add('active');
        }

        function deleteEvent(id) {
            if (!selectedDate) {
                alert('錯誤：未選擇日期');
                return;
            }

            if (!confirm('確定要刪除此日程嗎？此操作無法復原。')) return;
            
            const key = `${selectedDate.year}-${String(selectedDate.month+1).padStart(2,'0')}-${String(selectedDate.day).padStart(2,'0')}`;
            
            let deletedLocally = false;
            if (events[key] && events[key][id]) {
                delete events[key][id];
                if (Object.keys(events[key]).length === 0) {
                    delete events[key];
                }
                deletedLocally = true;
                saveLocalData();
                renderCalendar();
                renderEventList();
            }

            const eventRef = eventsRef.child(`${key}/${id}`);
            
            eventRef.remove()
                .then(() => {
                    if(!deletedLocally) {
                        renderCalendar();
                        renderEventList();
                    }
                    showToast('已刪除', 'success');
                })
                .catch((error) => {
                    console.error('[雲端刪除] 失敗:', error);
                    if(deletedLocally) {
                        showToast('本地已刪除，但同步失敗', 'error');
                    } else {
                        showToast('刪除失敗，請檢查網路', 'error');
                    }
                });
        }

        function renderStudentTable() {
            const tbody = document.getElementById('studentTableBody');
            const noData = document.getElementById('noStudentData');
            const count = document.getElementById('studentCount');
            if (!tbody) return;
            const list = Object.values(students);
            if (list.length === 0) {
                tbody.innerHTML = '';
                if (noData) noData.style.display = 'block';
                if (count) count.textContent = '';
                return;

            if (noData) noData.style.display = 'none';
            if (count) count.textContent = `共 ${list.length} 筆資料`;
            list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            tbody.innerHTML = list.map(s => `
                <tr>

                    <td style="padding:8px; border-bottom:1px solid #eee;">${s.englishName || '-'}</td>
                    <td style="padding:8px; border-bottom:1px solid #eee;">${s.class || '-'}</td>
                    <td style="padding:8px; border-bottom:1px solid #eee;">${s.mobile || '-'}</td>
                    <td style="padding:8px; border-bottom:1px solid #eee; font-size:0.8em;">${(s.availableDays || []).join('、') || '-'}</td>
                    <td style="padding:8px; border-bottom:1px solid #eee;">${s.retained === 'yes' ? '✅ 留班' + (s.retainedGrade || '') : '❌ 無'}</td>
                    <td style="padding:8px; border-bottom:1px solid #eee; text-align:center;">
                        <button class="edit-btn" onclick="editStudent('${s.id}')" style="padding:4px 10px;">編輯</button>
                        <button class="delete-btn" onclick="deleteStudent('${s.id}')" style="padding:4px 10px;">刪除</button>
                    </td>
                </tr>
            `).join('');
        }

        function saveStudent(e) {
            e.preventDefault();
            const id = editingStudentId || Date.now().toString();
            const retained = document.querySelector('input[name="retained"]:checked');
            const studentData = {
                id,
                chineseName: document.getElementById('studentChineseName').value.trim(),
                transliteration: document.getElementById('studentTransliteration').value.trim(),
                englishName: document.getElementById('studentEnglishName').value.trim(),
                class: document.getElementById('studentClass').value.trim(),
                mobile: document.getElementById('studentMobile').value.trim(),
                fatherName: document.getElementById('studentFatherName').value.trim(),
                fatherPhone: document.getElementById('studentFatherPhone').value.trim(),
                motherName: document.getElementById('studentMotherName').value.trim(),
                motherPhone: document.getElementById('studentMotherPhone').value.trim(),
                otherContact: document.getElementById('studentOtherContact').value.trim(),
                otherContactPhone: document.getElementById('studentOtherContactPhone').value.trim(),
                birth: document.getElementById('studentBirth').value,
                availableDays: getAvailableDays(),
                extracurricular: getExtraActivities(),
                retained: retained ? retained.value : 'no',
                retainedGrade: retained && retained.value === 'yes' ? document.getElementById('studentRetainedGrade').value : '',
                registerDate: editingStudentId ? (students[id]?.registerDate || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10),
                createdAt: editingStudentId ? (students[id]?.createdAt || Date.now()) : Date.now()
            };

            studentsRef.child(id).set(studentData)
                .then(() => {
                    showToast('已保存', 'success');
                    closeStudentFormModal();
                })
                .catch((err) => {
                    console.error('學生資料儲存失敗', err);
                    showToast('儲存失敗，請檢查網路', 'error');
                });
        }

        function editStudent(id) {
            const s = students[id];
            if (!s) return;
            editingStudentId = id;
            document.getElementById('studentFormTitle').textContent = '編輯報名';
            document.getElementById('studentChineseName').value = s.chineseName || '';
            document.getElementById('studentTransliteration').value = s.transliteration || '';
            document.getElementById('studentEnglishName').value = s.englishName || '';
            document.getElementById('studentClass').value = s.class || '';
            document.getElementById('studentMobile').value = s.mobile || '';
            document.getElementById('studentFatherName').value = s.fatherName || '';
            document.getElementById('studentFatherPhone').value = s.fatherPhone || '';
            document.getElementById('studentMotherName').value = s.motherName || '';
            document.getElementById('studentMotherPhone').value = s.motherPhone || '';
            document.getElementById('studentOtherContact').value = s.otherContact || '';
            document.getElementById('studentOtherContactPhone').value = s.otherContactPhone || '';
            document.getElementById('studentBirth').value = s.birth || '';
            // Checkboxes
            const days = s.availableDays || [];
            document.querySelectorAll('#daysCheckboxGroup input[type=checkbox]').forEach(c => {
                c.checked = days.includes(c.value);
            });
            // Extracurricular
            const container = document.getElementById('extracurricularContainer');
            container.innerHTML = '';
            const extras = s.extracurricular || [];
            extras.forEach(ex => {
                const row = document.createElement('div');
                row.className = 'extra-row';
                row.style.cssText = 'display:flex; gap:8px; margin-bottom:6px;';
                row.innerHTML = `
                    <select style="flex:0 0 100px; padding:8px; border:2px solid #e0e0e0; border-radius:8px;">
                        <option value="Mon"${ex.day === 'Mon' || ex.day === '星期一' ? ' selected' : ''}>Mon</option>
                        <option value="Tue"${ex.day === 'Tue' || ex.day === '星期二' ? ' selected' : ''}>Tue</option>
                        <option value="Wed"${ex.day === 'Wed' || ex.day === '星期三' ? ' selected' : ''}>Wed</option>
                        <option value="Thu"${ex.day === 'Thu' || ex.day === '星期四' ? ' selected' : ''}>Thu</option>
                        <option value="Fri"${ex.day === 'Fri' || ex.day === '星期五' ? ' selected' : ''}>Fri</option>
                        <option value="Sat"${ex.day === 'Sat' || ex.day === '星期六' ? ' selected' : ''}>Sat</option>
                    </select>
                    <input type="text" placeholder="活動內容" value="${ex.content || ''}" style="flex:1; padding:8px; border:2px solid #e0e0e0; border-radius:8px;">
                    <button type="button" onclick="removeExtraRow(this)" style="background:#e74c3c; color:white; border:none; border-radius:6px; padding:6px 12px; cursor:pointer;">✕</button>
                `;
                container.appendChild(row);
            });
            // Retained
            const retainedVal = s.retained || 'no';
            document.querySelectorAll('input[name="retained"]').forEach(r => {
                r.checked = r.value === retainedVal;
            });
            toggleRetainedGrade(retainedVal === 'yes');
            document.getElementById('studentRetainedGrade').value = s.retainedGrade || '';
            document.getElementById('studentFormModal').classList.add('active');
        }

        function deleteStudent(id) {
            if (!confirm('確定要刪除此學生報名嗎？此操作無法復原。')) return;
            studentsRef.child(id).remove()
                .then(() => showToast('已刪除', 'success'))
                .catch((err) => {
                    console.error('刪除失敗', err);
                    showToast('刪除失敗，請檢查網路', 'error');
                });
        }

        function clearAllStudents() {
            const count = Object.keys(students).length;
            if (count === 0) {
                showToast('目前沒有學生資料', 'info');
                return;
            }
            if (!confirm(`確定要清空全部 ${count} 筆學生資料嗎？`)) return;
            if (!confirm('⚠️ 最後確認：此操作會永久刪除所有學生報名資料，無法復原！')) return;
            studentsRef.remove()
                .then(() => showToast('已清空所有學生資料', 'success'))
                .catch((err) => {
                    console.error('清空失敗', err);
                    showToast('清空失敗，請檢查網路', 'error');
                });
        }

        function exportToExcel() {
            const list = Object.values(students);
            if (list.length === 0) {
                showToast('暫無資料可匯出', 'error');
                return;
            }
            const data = list.map(s => ({
                '中文姓名': s.chineseName || '',
                '中文姓名譯音': s.transliteration || '',
                'English Name': s.englishName || '',
                'Class': s.class || '',
                'Mobile No': s.mobile || '',
                '姓名(父親)': s.fatherName || '',
                '電話(父親)': s.fatherPhone || '',
                '姓名(母親)': s.motherName || '',
                '電話(母親)': s.motherPhone || '',
                '其他聯絡人': s.otherContact || '',
                '電話(其他聯絡人)': s.otherContactPhone || '',
                'Birth': s.birth || '',
                '可補習日子': (s.availableDays || []).join('、'),
                '校外活動': (s.extracurricular || []).map(e => `${e.day}:${e.content}`).join('; '),
                '留班': s.retained === 'yes' ? '有' : '無',
                '留班年級': s.retainedGrade || '',
                '登記日期': s.registerDate || ''
            }));
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(data);
            XLSX.utils.book_append_sheet(wb, ws, '學生報名');
            const colWidths = [
                { wch: 12 }, { wch: 16 }, { wch: 14 },
                { wch: 12 }, { wch: 14 }, { wch: 12 }, { wch: 14 },
                { wch: 12 }, { wch: 14 }, { wch: 14 },
                { wch: 20 }, { wch: 30 }, { wch: 8 }, { wch: 10 }, { wch: 12 }, { wch: 10 }
            ];
            ws['!cols'] = colWidths;
            XLSX.writeFile(wb, `學生報名表_${new Date().toISOString().slice(0,10)}.xlsx`);
            showToast(`已匯出 ${data.length} 筆資料`, 'success');
        }

        // ===== Excel 匯入功能 =====
        function normHeader(s) {
            return String(s || '').replace(/\s+/g, '').replace(/（/g, '(').replace(/）/g, ')').toLowerCase();
        }

        function importCellStr(v) {
            if (v instanceof Date) {
                return `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, '0')}-${String(v.getDate()).padStart(2, '0')}`;
            }
            return (v === null || v === undefined) ? '' : String(v).trim();
        }

        function handleImportFile(input) {
            const file = input.files[0];
            input.value = '';
            if (!file) return;
            const clearExisting = confirm('匯入方式：\n\n「確定」＝ 清空現有學生資料後匯入\n「取消」＝ 保留現有資料，附加匯入');
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    processImportWorkbook(new Uint8Array(e.target.result), clearExisting);
                } catch (err) {
                    console.error('匯入失敗', err);
                    showToast('匯入失敗：無法讀取檔案', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function processImportWorkbook(data, clearExisting) {
            const wb = XLSX.read(data, { type: 'array', cellDates: true });
            let rows = null;
            for (const name of wb.SheetNames) {
                const r = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '', cellDates: true });
                if (r.some(row => row.some(c => normHeader(c) === '中文名'))) {
                    rows = r;
                    break;
                }
            }
            if (!rows) {
                showToast('找不到「中文名」標題列，請確認是報名表格式', 'error');
                return;
            }

            const headerIdx = rows.findIndex(row => row.some(c => normHeader(c) === '中文名'));
            const headers = rows[headerIdx].map(normHeader);
            const col = (...names) => {
                for (const n of names) {
                    const idx = headers.indexOf(normHeader(n));
                    if (idx >= 0) return idx;
                }
                return -1;
            };

            const cMap = {
                chineseName: col('中文名'),
                transliteration: col('譯名'),
                englishName: col('name'),
                class: col('class'),
                mobile: col('mobile no.', 'mobile'),
                fatherName: col('姓名(父親)'),
                fatherPhone: col('電話(父親)'),
                motherName: col('姓名(母親)'),
                motherPhone: col('電話(母親)'),
                otherContact: col('其他聯絡人', '其他'),
                otherContactPhone: col('電話(其他聯絡人)', '電話(其他)'),
                birth: col('birth')
            };

            const DAY_LABELS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const dayCols = DAY_LABELS.map(label => ({
                label,
                idx: headers.indexOf(normHeader(label))
            }));
            const FULL_DAYS = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
            const actCols = FULL_DAYS.map((d, i) => ({
                label: DAY_LABELS[i],
                idx: headers.indexOf(d)
            }));

            const baseTs = Date.now();
            const records = {};
            let imported = 0;

            for (let i = headerIdx + 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.every(c => importCellStr(c) === '')) continue;
                const get = (idx) => idx >= 0 ? importCellStr(row[idx]) : '';
                const chineseName = get(cMap.chineseName);
                const englishName = get(cMap.englishName);
                const mobile = get(cMap.mobile);
                if (!chineseName && !englishName && !mobile) continue;

                const availableDays = dayCols.filter(dc => dc.idx >= 0 && get(dc.idx) !== '').map(dc => dc.label);
                const extracurricular = [];
                actCols.forEach(ac => {
                    if (ac.idx >= 0) {
                        const content = get(ac.idx);
                        if (content) extracurricular.push({ day: ac.label, content });
                    }
                });

                const id = `${baseTs}_${i}`;
                records[id] = {
                    id,
                    chineseName,
                    transliteration: get(cMap.transliteration),
                    englishName,
                    class: get(cMap.class),
                    mobile,
                    fatherName: get(cMap.fatherName),
                    fatherPhone: get(cMap.fatherPhone),
                    motherName: get(cMap.motherName),
                    motherPhone: get(cMap.motherPhone),
                    otherContact: get(cMap.otherContact),
                    otherContactPhone: get(cMap.otherContactPhone),
                    birth: get(cMap.birth),
                    availableDays,
                    extracurricular,
                    retained: 'no',
                    retainedGrade: '',
                    registerDate: new Date().toISOString().slice(0, 10),
                    createdAt: baseTs + imported
                };
                imported++;
            }

            if (imported === 0) {
                showToast('沒有找到可匯入的學生資料', 'error');
                return;
            }

            const doneMsg = () => showToast(`成功匯入 ${imported} 筆學生資料`, 'success');
            const failMsg = (err) => {
                console.error('匯入失敗', err);
                showToast('匯入失敗，請檢查網路連線', 'error');
            };
            if (clearExisting) {
                studentsRef.set(records).then(doneMsg).catch(failMsg);
            } else {
                studentsRef.update(records).then(doneMsg).catch(failMsg);
            }
        }

        function showToast(message, type) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
